name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate the visual baselines and upload them for review'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/runner

jobs:
  # ---------------------------------------------------------------------------
  # The image every other job runs inside. Built once, so the browsers and the
  # dependencies are installed once rather than four times.
  # ---------------------------------------------------------------------------
  image:
    name: Execution image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: env/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  static:
    name: Static checks
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/runner:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: yarn check

  # ---------------------------------------------------------------------------
  # Three test jobs against one shared demo host, each capped at a small worker
  # budget. The cap is a precaution rather than a measured limit: the host's
  # capacity varies, and the budget costs nothing while removing the suite as a
  # suspect when something times out.
  # ---------------------------------------------------------------------------
  functional:
    name: Functional (Chromium)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/runner:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      PW_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-functional
          path: |
            allure-results/
            playwright-report/
            test-results/
            reports/
          retention-days: 14

  webkit:
    name: Functional (WebKit)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/runner:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      PW_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - run: yarn test:e2e:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-webkit
          path: |
            allure-results/
            reports/
          retention-days: 14

  visual:
    name: Visual regression
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/runner:${{ needs.image.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      PW_WORKERS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Run the visual suite
        if: ${{ github.event.inputs.update_baselines != 'true' }}
        run: yarn test:vr

      # Regenerating and then immediately verifying, because a baseline is only
      # worth having if it reproduces. The first set this suite generated
      # contained two captures taken before the web fonts had painted: they
      # disagreed with every run afterwards, and looked like a regression in the
      # application rather than a mistake in the baseline.
      - name: Regenerate the baselines and verify they reproduce
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        run: |
          yarn test:vr:update
          yarn test:vr

      - name: Upload the regenerated baselines for review
        if: ${{ github.event.inputs.update_baselines == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: vr-tests/__screenshots__/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-visual
          path: |
            allure-results/
            test-results/
            reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The published reports. Only on main, and only once the suites have finished,
  # whatever they finished as: a failing run is exactly the run whose report
  # someone wants to read.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish reports
    needs: [functional, webkit, visual]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: incoming

      - name: Install the Allure command line
        run: npm install -g allure-commandline@2.32.0

      - name: Assemble the reports
        run: |
          set -eu
          mkdir -p site

          # One combined dashboard, and one per suite, because they answer
          # different questions and a single report would bury the visual
          # failures under twenty functional passes.
          merge() {
            local out="$1"; shift
            local dir="build/$out"
            mkdir -p "$dir"
            for src in "$@"; do
              [ -d "$src" ] && cp -r "$src"/. "$dir"/ || true
            done
            if [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              allure generate "$dir" --clean -o "site/$out"
            else
              mkdir -p "site/$out"
              echo "<p>No results in this run.</p>" > "site/$out/index.html"
            fi
          }

          merge functional incoming/results-functional/allure-results incoming/results-webkit/allure-results
          merge visual incoming/results-visual/allure-results
          merge . incoming/results-functional/allure-results incoming/results-webkit/allure-results incoming/results-visual/allure-results

          # The Playwright HTML report carries the traces, which is the only
          # place a reviewer can replay a failure step by step.
          if [ -d incoming/results-functional/playwright-report ]; then
            cp -r incoming/results-functional/playwright-report site/playwright-report
          fi

      - name: Build the suite health page
        run: node utils/scripts/suite-health.mjs --out site/metrics

      - uses: actions/configure-pages@v5
        id: pages_url

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # The gate.
  #
  # This is the only check branch protection requires. It reads the result of
  # every other job, so a job that stops running cannot quietly stop being
  # enforced: if someone deletes the visual job, this one fails on a missing
  # result rather than passing on an absent one.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    needs: [image, static, functional, webkit, visual]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | grep -o '"result": *"[a-z]*"' | grep -v '"success"' || true)
          if [ -n "$failed" ]; then
            echo "::error::one or more jobs did not succeed"
            exit 1
          fi
          echo "all jobs succeeded"
