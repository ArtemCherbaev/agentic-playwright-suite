name: Image

# The execution image, as a building block for the other workflows.
#
# The tag is the Playwright release plus a hash of everything the image is made
# from. A commit that only touches tests produces the same tag, finds the image
# already in the registry and skips the build; a commit that changes the
# lockfile or the Dockerfile gets a new image. Either way the caller receives a
# reference that matches the dependencies it is about to run with.

on:
  workflow_call:
    outputs:
      image:
        description: The image reference every container job runs in
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    name: Execution image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the image reference
        id: ref
        run: |
          set -eu
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=package.json::@playwright/test must be an exact version for the image to match it, found '$version'"
            exit 1
          fi
          hash=$(cat package.json yarn.lock .yarnrc.yml env/docker/Dockerfile | sha256sum | cut -c1-12)
          # Registry paths must be lower case; the account name is not.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runner:v${version}-${hash}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: $image"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for an image built from the same inputs
        id: existing
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${{ steps.ref.outputs.image }}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.found != 'true'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: env/docker/Dockerfile
          build-args: PLAYWRIGHT_VERSION=${{ steps.ref.outputs.version }}
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
