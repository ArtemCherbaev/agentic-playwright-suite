name: Update visual baselines

# Visual baselines are Chromium on Linux, captured in the execution image. A
# baseline generated anywhere else renders text differently and would never
# match, so they are regenerated here, in the same image the visual job
# compares them in, and committed from here.
#
# Run it deliberately, after the diff in a failed visual run has been read and
# the change it shows was intended. The new set is verified before it is
# committed: a baseline is only worth having if it reproduces.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the baselines are being regenerated
        required: true
        type: string

concurrency:
  group: update-vr-baselines
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  regenerate:
    name: Regenerate, verify, commit
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      PW_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point at the image's dependencies
        run: |
          ln -s /suite/node_modules node_modules
          mkdir -p .yarn && ln -s /suite/.yarn/install-state.gz .yarn/install-state.gz

      - name: Regenerate
        run: yarn test:vr:update

      - name: Verify the new set reproduces
        run: yarn test:vr

      - name: Commit
        env:
          REASON: ${{ inputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vr-tests/__screenshots__
          if git diff --cached --quiet; then
            echo "The baselines already match; nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "test(visual): regenerate the baselines" -m "$REASON"
          git push

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: regenerated-baselines
          path: |
            vr-tests/__screenshots__/
            test-results/
          retention-days: 14
