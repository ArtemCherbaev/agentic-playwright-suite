# Local use of the image CI runs.
#
#   yarn docker:vr          the visual suite, against committed Linux baselines
#   yarn docker:vr:update   regenerate those baselines
#   yarn docker:e2e         the functional suite
#
# The working tree is mounted over /suite, so the container runs the code in
# front of you and writes its baselines and reports back into it. The anonymous
# volume keeps the image's Linux node_modules from being shadowed by the host's.

services:
  runner:
    build:
      context: .
      dockerfile: env/docker/Dockerfile
      args:
        PLAYWRIGHT_VERSION: 1.63.0
    image: agentic-playwright-suite:local
    working_dir: /suite
    ipc: host
    environment:
      CI: 'true'
      BASE_URL: ${BASE_URL:-https://automationexercise.com}
      PW_WORKERS: ${PW_WORKERS:-1}
    volumes:
      - .:/suite
      - /suite/node_modules
